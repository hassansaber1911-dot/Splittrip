  <title>SplitTrip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ST</div>
        <div>
          <div class="brand-name">SplitTrip</div>
          <div class="brand-sub">Shared travel expenses</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-link active" data-view="home">Home</button>
        <button class="nav-link" data-view="trips">Trips</button>

          <h1 id="pageTitle">Home</h1>
          <p id="pageSubtitle">Track what everyone paid, consumed, and still owes.</p>
        </div>
        <button class="btn primary" id="newTripBtn">+ New Trip</button>
      </header>

      <section id="homeView" class="view active"></section>
      <section id="tripsView" class="view"></section>
      <section id="balancesView" class="view"></section>
      <section id="historyView" class="view"></section>
